# .github/workflows/render.yml
name: Render Video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID des zu rendernden Videos"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Systempakete installieren (ffprobe + Chrome-Abhängigkeiten für Remotion)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Python-Abhängigkeiten installieren
        run: pip install --quiet boto3 edge-tts

      - name: Node-Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Video rendern
        env:
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: python render.py
